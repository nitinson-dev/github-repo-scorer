spring:
  application:
    name: github-repo-scorer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only health and info; everything else stays off so we don't expose
        # more surface than a load-balancer probe needs.
        include: health,info

# OpenAPI 3 spec is generated from the controller and validation annotations by
# springdoc, served at /v3/api-docs; the interactive Swagger UI at /swagger-ui.html.
springdoc:
  swagger-ui:
    path: /swagger-ui.html

github:
  # Base URL of the GitHub REST API.
  base-url: https://api.github.com
  # Optional personal access token. Raises search rate limit from 10 to 30 req/min.
  # Provide via GITHUB_TOKEN env var; leave blank for unauthenticated access.
  token: ${GITHUB_TOKEN:}
  # Per-page size for the search endpoint (GitHub max: 100).
  page-size: 100
  # HTTP timeouts.
  connect-timeout: 5s
  read-timeout: 10s
  # Resilience for calls to GitHub. Retries cover transient failures only (5xx
  # and timeouts); rate limits and 4xx are never retried.
  resilience:
    # Total attempts per page fetch, including the first (1 disables retrying).
    max-attempts: 3
    # Wait before the first retry, growing by backoff-multiplier each attempt.
    initial-backoff: 500ms
    backoff-multiplier: 2.0
    # Circuit breaker: once failure-rate-threshold percent of the last
    # sliding-window-size calls fail, stop calling GitHub for wait-in-open-state
    # (also advised to callers as Retry-After) before probing again.
    failure-rate-threshold: 50
    sliding-window-size: 20
    minimum-number-of-calls: 10
    wait-in-open-state: 30s
    # Pause between sequential page fetches, so a multi-page request doesn't trip
    # GitHub's secondary (anti-abuse) rate limit. GitHub advises >= 1s between
    # search calls; only requests with limit > page-size page at all. Zero disables.
    inter-page-delay: 1s
  # Languages the API accepts. GitHub silently ignores an unknown language
  # qualifier and returns unfiltered results, so we reject anything outside this
  # set with a 400 rather than pass the quirk on to callers. This is a pragmatic
  # subset, not GitHub's full Linguist catalog; extend as needed.
  supported-languages:
    - Java
    - Kotlin
    - Scala
    - Groovy
    - Python
    - JavaScript
    - TypeScript
    - Go
    - Rust
    - Ruby
    - PHP
    - Swift
    - C
    - C++
    - C#

scoring:
  # Weights applied to the normalized factors. Must sum to 1.0.
  weights:
    stars: 0.5
    forks: 0.3
    recency: 0.2
  # Reference counts for log normalization: roughly the largest star/fork
  # counts on GitHub today. A repo at this level scores ~1.0 on that factor.
  reference:
    stars: 400000
    forks: 100000
  # Half-life (in days) of the recency decay: a repo pushed this long ago
  # scores 0.5 on the recency factor.
  recency-half-life-days: 180
